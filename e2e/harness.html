<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AssetForge — mock Figma host</title>
    <style>
      body { margin: 0; background: #2c2c2c; font: 12px system-ui; color: #ddd; }
      #frame { width: 380px; height: 680px; border: 0; background: #fff; display: block; margin: 16px; }
    </style>
  </head>
  <body>
    <!--
      The Figma plugin UI runs in an iframe with an opaque ("null") origin.
      srcdoc + sandbox without allow-same-origin reproduces that environment.
    -->
    <iframe id="frame" sandbox="allow-scripts allow-downloads allow-popups allow-modals"></iframe>
    <script type="module" src="/harness.js"></script>
  </body>
</html>
