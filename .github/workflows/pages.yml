# Publishes the plugin UI to GitHub Pages. The bundled UI in dist/index.html
# switches to this hosted copy at startup (see src/ui/lib/hosted.ts), which
# gives it persistent model caching and WebGPU.
#
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Deploy UI to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build:ui
      - name: Assemble site
        run: |
          mkdir -p site
          cp dist/index.html dist/version.json site/
          cp assets/icon-128.png site/favicon.png
          mkdir -p site/models
          cp models/*.onnx models/*.LICENSE site/models/
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
